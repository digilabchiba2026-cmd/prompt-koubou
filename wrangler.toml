name = "prompt-koubou"
main = "worker/index.js"
compatibility_date = "2026-09-01"
keep_vars = true

[observability]
enabled = true

# Geminiの地域制限エラーを避けるための配置ヒント(削除しない)
[placement]
region = "gcp:asia-northeast1"

# 静的サイト(site/ 配下)をASSETSとして配信
[assets]
directory = "./site"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "prompt-koubou-db"
database_id = "536171a3-75ed-4789-8a3c-0f9a0abe5b75"

# 月次バッチ(毎月2日・3日 03:00 JST = 毎月1日・2日 18:00 UTC。場面が多いため2日に分けて評価)
[triggers]
crons = ["0 18 1,2 * *"]

# Secrets(値はリポジトリに含めない。以下のコマンドで別途登録):
#   wrangler secret put GEMINI_API_KEY
#   wrangler secret put SLACK_BOT_TOKEN
#   wrangler secret put SLACK_CHANNEL_ID
#   wrangler secret put SLACK_SIGNING_SECRET
